name: Robot quotidien
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collecte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python robot.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Enregistrer les annonces
        run: |
          git config user.name "robot"
          git config user.email "robot@users.noreply.github.com"
          git add annonces.json annonces.db
          git commit -m "Mise à jour des annonces" || echo "Rien de nouveau"
          git push
